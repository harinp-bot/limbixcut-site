# Auth is handled by DecapBridge (decapbridge.com) — this backend block is the real one
# generated for this site. Do NOT replace it with a fresh copy of this file from Claude
# without checking this block first; ask Claude to merge instead.
backend:
  name: git-gateway
  repo: harinp-bot/limbixcut-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/8a7aa9c9-3e9a-442d-a53d-d80f9d7343e0/pkce
  auth_token_endpoint: /sites/8a7aa9c9-3e9a-442d-a53d-d80f9d7343e0/token
  gateway_url: https://gateway.decapbridge.com

# Where uploaded images (project thumbnails) are stored in the repo,
# and the URL path the site uses to reach them.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Thai labels are shown in the admin UI; English stays underneath in the repo files.
locale: "en"

collections:
  - name: "site"
    label: "จัดการเว็บไซต์ LIMBIX CUT"
    files:
      - name: "projects"
        label: "ผลงาน (หน้า Work)"
        file: "content/projects.json"
        fields:
          - label: "รายการผลงานทั้งหมด"
            name: "items"
            widget: "list"
            label_singular: "ผลงาน 1 ชิ้น"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "ชื่อโปรเจกต์", name: "title", widget: "string" }
              - label: "ประเภท"
                name: "category"
                widget: "select"
                options: ["Films", "Series", "Commercials", "Music Videos"]
              - { label: "ลูกค้า / แพลตฟอร์ม", name: "client", widget: "string", required: false }
              - label: "ปี"
                name: "year"
                widget: "string"
                required: false
                hint: "ใส่เป็นตัวเลข เช่น 2024 — ผลงานจะเรียงจากปีใหม่ไปเก่าอัตโนมัติ"
              - label: "ปักหมุดไว้บนสุด (Featured)"
                name: "pinned"
                widget: "boolean"
                default: false
                required: false
                hint: "ติ๊กแล้วผลงานชิ้นนี้จะอยู่บนสุดเสมอ ไม่ว่าปีจะเก่าแค่ไหน (ผลงานที่ปักหมุดหลายชิ้น จะเรียงกันเองตามปีเหมือนกัน) ผลงานที่เหลือเรียงตามปีใหม่ไปเก่าอัตโนมัติ ไม่ต้องจัดลำดับเอง"
              - label: "ลิงก์วิดีโอ (YouTube, Vimeo ฯลฯ)"
                name: "videoUrl"
                widget: "string"
                required: false
                hint: "วางลิงก์ตัวอย่าง/เทรลเลอร์ กดที่การ์ดผลงานบนเว็บแล้วจะเปิดลิงก์นี้"
              - label: "รูปปก (ไม่ใส่ก็ได้ ระบบจะใช้สีพื้นแทน)"
                name: "thumbnail"
                widget: "image"
                required: false
              - label: "ตำแหน่งที่โชว์ของรูปปก"
                name: "thumbnailPosition"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "กึ่งกลาง (ค่าเริ่มต้น)", value: "center" }
                  - { label: "บน", value: "top" }
                  - { label: "ล่าง", value: "bottom" }
                  - { label: "ซ้าย", value: "left" }
                  - { label: "ขวา", value: "right" }
                  - { label: "บนซ้าย", value: "top left" }
                  - { label: "บนขวา", value: "top right" }
                  - { label: "ล่างซ้าย", value: "bottom left" }
                  - { label: "ล่างขวา", value: "bottom right" }
                hint: "รูปปกจะถูก crop ให้เต็มกรอบเสมอ — ถ้าจุดสำคัญของรูป (เช่น หน้าคนในโปสเตอร์) โดนตัดออกไป ลองเปลี่ยนตำแหน่งตรงนี้ดูจนกว่าจะเห็นจุดที่ต้องการ"

      - name: "team"
        label: "ทีมงาน (หน้า Team)"
        file: "content/team.json"
        fields:
          - label: "รายชื่อทีมงานทั้งหมด"
            name: "items"
            widget: "list"
            label_singular: "สมาชิก 1 คน"
            summary: "{{name}} — {{title}}"
            fields:
              - { label: "ชื่อ-นามสกุล", name: "name", widget: "string" }
              - { label: "ตำแหน่ง", name: "title", widget: "string" }
              - label: "รูปภาพ (ไม่ใส่ก็ได้ ระบบจะใช้กล่องพื้นเทาแทน)"
                name: "photo"
                widget: "image"
                required: false
              - label: "ลิงก์ IMDb (หรือลิงก์โปรไฟล์อื่นที่อยากให้กดเข้าไปดู)"
                name: "imdbUrl"
                widget: "string"
                required: false
                hint: "ใส่แล้วการ์ดชื่อคนนี้จะกดเปิดลิงก์ในแท็บใหม่ได้เลย ไม่ใส่ = การ์ดกดไม่ได้เหมือนเดิม"

      - name: "settings"
        label: "ข้อมูลติดต่อ & สถิติหน้าแรก"
        file: "content/settings.json"
        fields:
          # ── เมนู (บนสุดของทุกหน้า + คอลัมน์ Studio ท้ายเว็บ) ──
          - { label: "เมนู — Work", name: "navWork", widget: "string" }
          - { label: "เมนู — About", name: "navAbout", widget: "string" }
          - { label: "เมนู — Team", name: "navTeam", widget: "string" }
          - { label: "เมนู — Contact", name: "navContact", widget: "string" }
          - { label: "ปุ่มเมนู (มุมขวาบน)", name: "navCta", widget: "string" }

          # ── ส่วน Hero (หน้าแรกสุด) ──
          - label: "ข้อความเล็กเหนือหัวข้อใหญ่ (Hero)"
            name: "heroEyebrow"
            widget: "string"
          - label: "หัวข้อใหญ่ Hero — ข้อความก่อนคำที่ไฮไลต์สี"
            name: "heroTitleBefore"
            widget: "string"
            hint: "เช่น 'We cut for ' — คำถัดไปจะเป็นคำที่ขึ้นเป็นสีฟ้า"
          - label: "หัวข้อใหญ่ Hero — คำที่ไฮไลต์สี"
            name: "heroTitleAccent"
            widget: "string"
          - label: "หัวข้อใหญ่ Hero — ข้อความหลังคำที่ไฮไลต์สี"
            name: "heroTitleAfter"
            widget: "string"
          - label: "ย่อหน้าใต้หัวข้อใหญ่ (Hero)"
            name: "heroSub"
            widget: "text"
          - label: "ปุ่ม Hero ปุ่มที่ 1 (ลิงก์ไปหมวดผลงาน)"
            name: "heroBtnWork"
            widget: "string"
          - label: "ปุ่ม Hero ปุ่มที่ 2 (ลิงก์ไปติดต่อ)"
            name: "heroBtnContact"
            widget: "string"

          # ── แถบ Work trusted by ──
          - label: "ข้อความนำหน้ารายชื่อลูกค้า"
            name: "clientsLabel"
            widget: "string"

          # ── ส่วน Work (ผลงาน) ──
          - { label: "เลขหัวข้อ Work (เช่น — 01 SELECTED WORK)", name: "workSecNum", widget: "string" }
          - label: "ข้อความใต้หัวข้อ Recent Cuts (หน้า Work)"
            name: "workIntro"
            widget: "text"

          # ── ส่วน Philosophy (About) ──
          - { label: "เลขหัวข้อ Philosophy (เช่น — 02 PHILOSOPHY)", name: "aboutSecNum", widget: "string" }
          - label: "หัวข้อใหญ่ในส่วน Philosophy"
            name: "aboutLead"
            widget: "text"
          - label: "เนื้อหาย่อหน้า Philosophy (ประวัติสตูดิโอ)"
            name: "aboutText"
            widget: "text"
          - label: "ตัวเลขสถิติในส่วน Philosophy"
            name: "aboutStats"
            widget: "list"
            summary: "{{num}} — {{label}}"
            fields:
              - { label: "ตัวเลข", name: "num", widget: "string" }
              - { label: "คำอธิบาย", name: "label", widget: "string" }

          # ── ส่วน Team ──
          - { label: "เลขหัวข้อ Team (เช่น — 03 TEAM)", name: "teamSecNum", widget: "string" }
          - { label: "หัวข้อใหญ่ส่วน Team (เช่น The Editors)", name: "teamHeading", widget: "string" }
          - label: "ข้อความใต้หัวข้อ The Editors (หน้า Team)"
            name: "teamIntro"
            widget: "text"

          # ── แถบ CTA (ก่อนท้ายเว็บ) ──
          - label: "หัวข้อ CTA — ข้อความก่อนคำที่ไฮไลต์สี"
            name: "ctaHeadingBefore"
            widget: "string"
            hint: "เช่น 'Got a cut that needs a '"
          - label: "หัวข้อ CTA — คำที่ไฮไลต์สี"
            name: "ctaHeadingAccent"
            widget: "string"
          - label: "หัวข้อ CTA — ข้อความหลังคำที่ไฮไลต์สี"
            name: "ctaHeadingAfter"
            widget: "string"
            hint: "เช่น '?'"
          - { label: "ข้อความปุ่ม CTA", name: "ctaButtonText", widget: "string" }

          # ── ท้ายเว็บ (Footer) ──
          - { label: "หัวข้อคอลัมน์ Studio", name: "footStudioHeading", widget: "string" }
          - { label: "หัวข้อคอลัมน์ Contact", name: "footContactHeading", widget: "string" }
          - { label: "หัวข้อคอลัมน์ Follow", name: "footFollowHeading", widget: "string" }
          - label: "ข้อความบรรทัดล่างสุดของเว็บ"
            name: "footTagline"
            widget: "string"
            hint: "ลิงก์ '/admin' ต่อท้ายให้อัตโนมัติ ไม่ต้องพิมพ์เอง"

          # ── SEO (ชื่อแท็บเบราว์เซอร์ / ผลค้นหา Google) ──
          - { label: "ชื่อเว็บ (โชว์บนแท็บเบราว์เซอร์ + Google)", name: "seoTitle", widget: "string" }
          - label: "คำอธิบายเว็บ (โชว์ใต้ชื่อเว็บใน Google)"
            name: "seoDescription"
            widget: "text"

          - label: "โลโก้บนเมนู (แถบบนสุดของเว็บ)"
            name: "logo"
            widget: "image"
            required: false
            hint: "ไม่ใส่ = ใช้โลโก้ LIMBIX CUT เดิม (ไฟล์ LC_Original ที่ให้มา) ถ้าอัปโหลดใหม่ ระบบจะโชว์ตามไฟล์นั้นตรงๆ ไม่มีคำว่า LIMBIX CUT ไปต่อท้ายให้ ดังนั้นอัปโหลดไฟล์ที่มีทั้งไอคอนและตัวหนังสือครบในตัวเองเลย (แนะนำไฟล์พื้นหลังโปร่งใส แนวนอน) จุดนี้จะเปลี่ยนแค่ที่เมนูบนสุดเท่านั้น ไอคอน X เล็กๆ ที่จุดอื่น (ลายน้ำ Hero, ท้ายเว็บ, favicon) จะไม่เปลี่ยนตาม"
          - label: "รูปพื้นหลัง Hero (หน้าแรกสุด)"
            name: "heroBackground"
            widget: "image"
            required: false
            hint: "ไม่ใส่ = ใช้พื้นดำ + โลโก้จางๆ แบบเดิม ถ้าอัปโหลดรูป จะโชว์รูปนี้เป็นพื้นหลังแทน (แนะนำรูปแนวนอน ความละเอียดสูง)"
          - { label: "อีเมล", name: "email", widget: "string" }
          - { label: "เบอร์โทร", name: "phone", widget: "string" }
          - { label: "ที่อยู่", name: "address", widget: "string" }
          - { label: "ลิงก์ Instagram", name: "instagram", widget: "string", required: false }
          - { label: "ลิงก์ Facebook", name: "facebook", widget: "string", required: false }
          - { label: "ข้อความลิขสิทธิ์ท้ายเว็บ", name: "copyright", widget: "string" }
          - label: "รายชื่อลูกค้า/แพลตฟอร์ม (แสดงใต้ Hero)"
            name: "clients"
            widget: "list"
            summary: "{{name}}"
            hint: "ใส่โลโก้ได้เลย ถ้าช่องไหนยังไม่ใส่โลโก้ ระบบจะโชว์เป็นชื่อตัวหนังสือแทนไปก่อน"
            fields:
              - { label: "ชื่อ (ใช้เป็นชื่อสำรองถ้ายังไม่มีโลโก้ และใช้เป็น alt text ของรูป)", name: "name", widget: "string" }
              - label: "โลโก้ (ไม่ใส่ก็ได้)"
                name: "logo"
                widget: "image"
                required: false
                hint: "แนะนำไฟล์พื้นหลังโปร่งใส (PNG) แนวนอน โลโก้จะแสดงเป็นสีจริงตามไฟล์ที่อัปโหลด"
          - label: "ตัวเลขสถิติ (แสดงใน Hero)"
            name: "stats"
            widget: "list"
            summary: "{{num}} — {{label}}"
            fields:
              - { label: "ตัวเลข", name: "num", widget: "string" }
              - { label: "คำอธิบาย", name: "label", widget: "string" }
